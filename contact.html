<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Contact page for My Page v2">
    <title>My Page v2 | Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="contact-page">
    <header class="simple-header">
      <nav class="navigation" aria-label="เมนูหลัก">
        <a class="brand" href="index.html">MY PAGE <span>V2</span></a>
        <a class="text-link" href="index.html">← กลับหน้าหลัก</a>
      </nav>
    </header>
    <main class="contact-main">
      <section class="contact-card" aria-labelledby="contact-title">
        <p class="section-label">Contact Form</p>
        <h1 id="contact-title">ติดต่อฉัน</h1>
        <p>กรอกข้อมูลด้านล่างเพื่อติดต่อฉัน</p>
        <form action="#contact-form" id="contact-form">
          <label for="name">ชื่อ</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
          <label for="email">อีเมล</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <label for="message">ข้อความ</label>
          <textarea id="message" name="message" rows="5" required></textarea>
          <button class="button" type="submit">ส่งข้อความ</button>
        </form>
      </section>
    </main>
    <footer>
      <p>สร้างด้วย HTML และ CSS สำหรับ Homework 3</p>
      <div><a href="https://github.com/" target="_blank" rel="noreferrer">GitHub</a><a href="contact.html">Contact</a></div>
    </footer>
  </body>
</html>
